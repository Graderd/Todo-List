name: Publicar imagen Docker

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: graderd/todo-list-api

jobs:
  publish:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar etiquetas y metadatos
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v7
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Solicitar despliegue en producción
        shell: bash
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          VERSION="${TAG_NAME#v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: versión inválida: $VERSION"
            exit 1
          fi

          echo "Solicitando despliegue de la versión $VERSION"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /tmp/deploy-response.txt \
            --write-out "%{http_code}" \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${DEPLOY_TOKEN}" \
            https://api.github.com/repos/Graderd/todo-list-deploy/actions/workflows/deploy.yml/dispatches \
            --data "{
              \"ref\": \"main\",
              \"inputs\": {
                \"version\": \"$VERSION\"
              }
            }")

          echo "GitHub API respondió HTTP ${HTTP_STATUS}"

          if [ "$HTTP_STATUS" != "204" ]; then
            echo "ERROR: no se pudo solicitar el despliegue."
            cat /tmp/deploy-response.txt
            exit 1
          fi

          echo "Despliegue solicitado correctamente."
