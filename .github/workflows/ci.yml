name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar API y Docker
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8

        env:
          MYSQL_ROOT_PASSWORD: ci_root_password
          MYSQL_DATABASE: todoapp_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: ci_test_password

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-start-period=20s
          --health-retries=10

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Instalar dependencias
        working-directory: api
        run: npm ci

      - name: Validar sintaxis JavaScript
        working-directory: api
        run: |
          while IFS= read -r -d '' file; do
            echo "Revisando: $file"
            node --check "$file"
          done < <(
            find . \
              -type f \
              -name "*.js" \
              -not -path "./node_modules/*" \
              -print0
          )

      - name: Crear estructura de la base de pruebas
        run: |
          docker run --rm \
            --network host \
            -i \
            -e MYSQL_PWD=ci_test_password \
            mysql:8 \
            mysql \
              -h127.0.0.1 \
              -P3306 \
              -utest_user \
              todoapp_test \
              < api/database/schema.sql

      - name: Ejecutar pruebas automáticas
        working-directory: api
        env:
          NODE_ENV: test
          JWT_SECRET: secreto-jwt-exclusivo-para-ci
          DB_HOST: 127.0.0.1
          DB_USER: test_user
          DB_PASSWORD: ci_test_password
          DB_NAME: todoapp_test
        run: npm test

      - name: Revisar vulnerabilidades altas o críticas
        working-directory: api
        run: npm audit --audit-level=high

      - name: Preparar variables ficticias
        run: |
          cp .env.example .env
          cp api/.env.example api/.env

      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Construir imagen Docker
        run: docker build -t todo-list-api:${{ github.sha }} ./api
